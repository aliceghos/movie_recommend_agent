[pytest]
# pythonpath = . 让 tests/ 里能 import server / movie_agent，而不必装成包
pythonpath = .
testpaths = tests
asyncio_mode = auto
# 每个用例一个事件循环。夹具里 init_engine/dispose_engine 是成对的，
# 循环级共享 engine 会在跨用例时踩到"连接属于另一个 loop"。
asyncio_default_fixture_loop_scope = function
markers =
    slow: 打真实模型或真实 MCP 的用例，默认跳过（-m slow 单独跑）
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
